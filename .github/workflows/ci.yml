name: SwiftMD
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    container:
      image: swift@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build static DocC site
        run: sh Scripts/build-docc.sh /tmp/swiftmd-docc-build /tmp/swiftmd-docc-site Swift-MD
  supervisor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve and verify the pinned SwiftHTML release
        run: |
          swift package --package-path Adapters/SwiftMDBlocks resolve
          python3 Scripts/check-swifthtml-checkout.py
      - name: Exercise Linux supervisor process boundaries
        run: |
          python3 Scripts/test-linux-supervisor.py \
            LinuxSupervisor.test_empty_input_immediate_success \
            LinuxSupervisor.test_binary_stream_and_inherited_limits \
            LinuxSupervisor.test_input_limit_fails_without_output \
            LinuxSupervisor.test_exact_stream_limits_succeed \
            LinuxSupervisor.test_stdout_limit_fails_without_partial_output \
            LinuxSupervisor.test_stderr_limit_fails_without_output \
            LinuxSupervisor.test_worker_error_suppresses_partial_stdout \
            LinuxSupervisor.test_deadline_kills_worker_group_and_discards_partial_output \
            LinuxSupervisor.test_detached_child_remains_a_documented_boundary \
            LinuxSupervisor.test_deadline_includes_slow_stdin \
            LinuxSupervisor.test_deadline_includes_stalled_output_delivery \
            LinuxSupervisor.test_sigterm_cleans_up_worker_group
      - name: Probe systemd cgroup boundaries on the disposable runner
        run: sudo -n python3 Scripts/test-linux-systemd-probe.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Build installed systemd worker test dependencies
        run: |
          npm ci --ignore-scripts --prefix Tools/NodeDependencies
          swift --version
          swift build --package-path Tools/SwiftMDCLI -c debug -j 4 --static-swift-stdlib
          BIN="$(swift build --package-path Tools/SwiftMDCLI -c debug --show-bin-path)/swift-md"
          sudo install -d -m 0755 /usr/libexec/swiftmd-isolation-test
          sudo install -m 0644 Scripts/run-linux-systemd.py Scripts/systemd-worker-guard.py Scripts/run-linux-supervised.py /usr/libexec/swiftmd-isolation-test/
          sudo install -m 0755 "$BIN" /usr/libexec/swiftmd-isolation-test/swift-md
          sudo install -m 0755 "$(command -v node)" /usr/libexec/swiftmd-isolation-test/node
          sudo cp -R Tools/NodeDependencies/node_modules /usr/libexec/swiftmd-isolation-test/
          sudo chmod -R a+rX /usr/libexec/swiftmd-isolation-test/node_modules
      - name: Exercise systemd worker with the real CLI
        run: sudo -n python3 Scripts/test-linux-systemd-worker.py
  core:
    runs-on: ubuntu-latest
    container: swift:6.2.4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift test -j 4
  linux-archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve and verify the pinned SwiftHTML release
        run: |
          swift package --package-path Adapters/SwiftMDBlocks resolve
          python3 Scripts/check-swifthtml-checkout.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Build local candidate and prepare clean target inputs
        run: |
          swift package --package-path Tools/SwiftMDCLI resolve
          Scripts/build-linux-candidate.sh "$RUNNER_TEMP/swiftmd-candidate.tar.gz"
          npm ci --ignore-scripts --prefix Tools/NodeDependencies
          mkdir -p "$RUNNER_TEMP/archive-test/test/Scripts" \
            "$RUNNER_TEMP/archive-test/test/Tools/SwiftMDCLI" \
            "$RUNNER_TEMP/archive-test/test/Tools/NodeDependencies"
          tar -xzf "$RUNNER_TEMP/swiftmd-candidate.tar.gz" -C "$RUNNER_TEMP/archive-test"
          cp "$(command -v node)" "$RUNNER_TEMP/archive-test/node"
          cp Scripts/test-cli.py "$RUNNER_TEMP/archive-test/test/Scripts/"
          cp Tools/SwiftMDCLI/Package.resolved "$RUNNER_TEMP/archive-test/test/Tools/SwiftMDCLI/"
          cp -a Tools/NodeDependencies/node_modules "$RUNNER_TEMP/archive-test/test/Tools/NodeDependencies/"
      - name: Test candidate on clean Ubuntu without Swift
        run: |
          docker run --rm -v "$RUNNER_TEMP/archive-test:/work" ubuntu:24.04 sh -euxc '
            apt-get update -qq
            apt-get install -y --no-install-recommends python3 libxml2 libicu74 zlib1g liblzma5 libstdc++6 libgcc-s1 libatomic1
            if command -v swift; then exit 1; fi
            cd /work/SwiftMD
            sha256sum -c SHA256SUMS
            test -f licenses/SwiftSoup-MIT.txt
            test -f licenses/SwiftSoup-jsoup-MIT.txt
            if ldd bin/swift-md | grep "not found"; then exit 1; fi
            SWIFTMD_NODE=/work/node SWIFTMD_CLI=/work/SwiftMD/bin/swift-md python3 /work/test/Scripts/test-cli.py
          '
  integration:
    runs-on: ubuntu-latest
    container: swift:6.2.4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve and verify the pinned SwiftHTML release
        run: |
          swift package --package-path Adapters/SwiftMDBlocks resolve
          python3 Scripts/check-swifthtml-checkout.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --prefix Tools/NodeDependencies
      - name: Build independent cmark-gfm reference
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake build-essential curl python3 util-linux
          git clone --no-checkout https://github.com/github/cmark-gfm.git /tmp/cmark-reference
          git -C /tmp/cmark-reference checkout --detach 27d942c8b0a62d192f616e5bf3578f4b6a89e180
          cmake -S /tmp/cmark-reference -B /tmp/cmark-reference/build -DCMARK_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/cmark-reference/build -j 4
      - name: Test real renderers and reference
        env:
          SWIFTMD_CMARK_REFERENCE: /tmp/cmark-reference/build/src/cmark-gfm
        run: Scripts/test-all.sh
      - name: Check committed example HTML
        run: python3 Scripts/render-examples.py --binary Tools/SwiftMDCLI/.build/debug/swift-md --node "$(command -v node)" --check
      - name: Verify SwiftHTML's vendored source against upstream source only
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 --branch 2.14.4 https://github.com/scinfu/SwiftSoup.git /tmp/swiftsoup-reference
          git -C /tmp/swiftsoup-reference sparse-checkout set --cone Sources
          git -C /tmp/swiftsoup-reference checkout --detach 8397a860c6955924b584c50c5265c6aac0970015
          test ! -e /tmp/swiftsoup-reference/Tests-macOS/corpus
          python3 Adapters/SwiftMDBlocks/.build/checkouts/Swift-HTML/Scripts/verify-upstream.py --reference /tmp/swiftsoup-reference
      - name: Verify pinned notices, fixtures, and npm archives
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/mermaid-js/mermaid/1fb7869866dd619168d840291c9c54b4f129758b/packages/mermaid/src/diagrams/user-journey/parser/journey.jison \
            --output /tmp/mermaid-journey.jison
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/mermaid-js/mermaid/1fb7869866dd619168d840291c9c54b4f129758b/packages/mermaid/src/diagrams/timeline/parser/timeline.jison \
            --output /tmp/mermaid-timeline.jison
          python3 Scripts/audit-dependencies.py --cmark-source /tmp/cmark-reference --npm-tarballs \
            --mermaid-journey /tmp/mermaid-journey.jison --mermaid-timeline /tmp/mermaid-timeline.jison
      - name: Compare HighlightKit fixtures with independent upstream history
        run: |
          git clone --no-checkout https://github.com/PhraseHQ/HighlightKit.git /tmp/highlightkit-reference
          git clone --no-checkout https://github.com/highlightjs/highlight.js.git /tmp/highlightjs-reference
          python3 Scripts/audit-highlight-fixtures.py --highlightkit-source /tmp/highlightkit-reference \
            --highlightjs-source /tmp/highlightjs-reference
      - name: Check mirror generator publication boundaries
        run: python3 Scripts/test-mirror-policy.py
      - name: Test isolated version-based distribution consumers
        run: |
          SWIFTMD_NODE="$(command -v node)" \
          SWIFTMD_KATEX="$GITHUB_WORKSPACE/Tools/NodeDependencies/node_modules/katex" \
          SWIFTMD_PELE="$GITHUB_WORKSPACE/Tools/NodeDependencies/node_modules/pele/dist/pele.js" \
          python3 Scripts/test-distribution.py
      # A compatible public Core tag must exist before this publication gate
      # can run. The synthetic local mirror gate above still runs on every PR.
      - name: Test mirror with verified public dependencies
        if: ${{ github.event_name == 'push' && github.ref_type == 'branch' && !github.event.repository.private && vars.SWIFTMD_PUBLIC_CORE_VERSION != '' }}
        env:
          SWIFTMD_PUBLIC_CORE_VERSION: ${{ vars.SWIFTMD_PUBLIC_CORE_VERSION }}
        run: |
          SWIFTHTML_URL="$(python3 -c 'import json; print(json.load(open("Adapters/SwiftMDBlocks/SwiftHTML-PROVENANCE.json"))["public_repository"] or "")')"
          SWIFTHTML_VERSION="$(python3 -c 'import json; print(json.load(open("Adapters/SwiftMDBlocks/SwiftHTML-PROVENANCE.json"))["public_version"] or "")')"
          test -n "$SWIFTHTML_URL" && test -n "$SWIFTHTML_VERSION" || { echo 'Public SwiftHTML version is not configured; publication gate blocked' >&2; exit 1; }
          CANDIDATE="$(mktemp -d)/mirror"
          python3 Scripts/generate-adapter-mirror.py "$CANDIDATE" \
            --core-version "$SWIFTMD_PUBLIC_CORE_VERSION" --gfm-version 1.1.0 --highlight-version 1.0.1 \
            --swifthtml-url "$SWIFTHTML_URL" --swifthtml-version "$SWIFTHTML_VERSION" \
            --verify-public-dependencies --include-locked-renderers
          python3 Scripts/test-public-candidate.py "$CANDIDATE" --node "$(command -v node)"
      - name: Build and test Linux release CLI
        run: |
          swift build --package-path Tools/SwiftMDCLI -c release -j 4 -Xswiftc -no-whole-module-optimization
          SWIFTMD_NODE="$(command -v node)" SWIFTMD_CLI="$GITHUB_WORKSPACE/Tools/SwiftMDCLI/.build/release/swift-md" python3 Scripts/test-cli.py
          SWIFTMD_NODE="$(command -v node)" SWIFTMD_CLI="$GITHUB_WORKSPACE/Tools/SwiftMDCLI/.build/release/swift-md" \
            SWIFTMD_KATEX="$GITHUB_WORKSPACE/Tools/NodeDependencies/node_modules/katex" \
            SWIFTMD_PELE="$GITHUB_WORKSPACE/Tools/NodeDependencies/node_modules/pele/dist/pele.js" \
            python3 Scripts/test-markdown-math-cli.py
