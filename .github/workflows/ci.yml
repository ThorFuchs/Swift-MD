name: SwiftMD
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    container:
      image: swift@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build static DocC site
        run: sh Scripts/build-docc.sh /tmp/swiftmd-docc-build /tmp/swiftmd-docc-site Swift-MD
  supervisor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exercise Linux supervisor process boundaries
        run: |
          python3 Scripts/test-linux-supervisor.py \
            LinuxSupervisor.test_empty_input_immediate_success \
            LinuxSupervisor.test_binary_stream_and_inherited_limits \
            LinuxSupervisor.test_input_limit_fails_without_output \
            LinuxSupervisor.test_exact_stream_limits_succeed \
            LinuxSupervisor.test_stdout_limit_fails_without_partial_output \
            LinuxSupervisor.test_stderr_limit_fails_without_output \
            LinuxSupervisor.test_worker_error_suppresses_partial_stdout \
            LinuxSupervisor.test_deadline_kills_worker_group_and_discards_partial_output \
            LinuxSupervisor.test_detached_child_remains_a_documented_boundary \
            LinuxSupervisor.test_deadline_includes_slow_stdin \
            LinuxSupervisor.test_deadline_includes_stalled_output_delivery \
            LinuxSupervisor.test_sigterm_cleans_up_worker_group
      - name: Probe systemd cgroup boundaries on the disposable runner
        run: sudo -n python3 Scripts/test-linux-systemd-probe.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Build installed systemd worker test dependencies
        run: |
          npm ci --ignore-scripts --prefix Tools/NodeDependencies
          swift --version
          swift build --package-path Tools/SwiftMDCLI -c debug -j 4 --static-swift-stdlib
          BIN="$(swift build --package-path Tools/SwiftMDCLI -c debug --show-bin-path)/swift-md"
          sudo install -d -m 0755 /usr/libexec/swiftmd-isolation-test
          sudo install -m 0644 Scripts/run-linux-systemd.py Scripts/systemd-worker-guard.py Scripts/run-linux-supervised.py /usr/libexec/swiftmd-isolation-test/
          sudo install -m 0755 "$BIN" /usr/libexec/swiftmd-isolation-test/swift-md
          sudo install -m 0755 "$(command -v node)" /usr/libexec/swiftmd-isolation-test/node
          sudo cp -R Tools/NodeDependencies/node_modules /usr/libexec/swiftmd-isolation-test/
          sudo chmod -R a+rX /usr/libexec/swiftmd-isolation-test/node_modules
      - name: Exercise systemd worker with the real CLI
        run: sudo -n python3 Scripts/test-linux-systemd-worker.py
  core:
    runs-on: ubuntu-latest
    container: swift:6.2.4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift test -j 4
  integration:
    runs-on: ubuntu-latest
    container: swift:6.2.4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --prefix Tools/NodeDependencies
      - name: Build independent cmark-gfm reference
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake build-essential python3 util-linux
          git clone --no-checkout https://github.com/github/cmark-gfm.git /tmp/cmark-reference
          git -C /tmp/cmark-reference checkout --detach 27d942c8b0a62d192f616e5bf3578f4b6a89e180
          cmake -S /tmp/cmark-reference -B /tmp/cmark-reference/build -DCMARK_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/cmark-reference/build -j 4
      - name: Test real renderers and reference
        env:
          SWIFTMD_CMARK_REFERENCE: /tmp/cmark-reference/build/src/cmark-gfm
        run: Scripts/test-all.sh
      - name: Check committed example HTML
        run: python3 Scripts/render-examples.py --binary Tools/SwiftMDCLI/.build/debug/swift-md --node "$(command -v node)" --check
      - name: Verify pinned notices, fixtures, and npm archives
        run: python3 Scripts/audit-dependencies.py --cmark-source /tmp/cmark-reference --npm-tarballs
      - name: Check mirror generator publication boundaries
        run: python3 Scripts/test-mirror-policy.py
      - name: Test isolated version-based distribution consumers
        run: |
          SWIFTMD_NODE="$(command -v node)" \
          SWIFTMD_KATEX="$GITHUB_WORKSPACE/Tools/NodeDependencies/node_modules/katex" \
          SWIFTMD_PELE="$GITHUB_WORKSPACE/Tools/NodeDependencies/node_modules/pele/dist/pele.js" \
          python3 Scripts/test-distribution.py
      # Only an advertised branch commit can be checked against public refs;
      # the synthetic local mirror gate above still runs on pull requests.
      - name: Test mirror with verified public dependencies
        if: ${{ github.event_name == 'push' && github.ref_type == 'branch' && !github.event.repository.private }}
        run: |
          CANDIDATE="$(mktemp -d)/mirror"
          python3 Scripts/generate-adapter-mirror.py "$CANDIDATE" \
            --core-version 0.1.0 --gfm-version 1.0.1 --highlight-version 1.0.1 \
            --verify-public-dependencies --include-locked-renderers
          python3 Scripts/test-public-candidate.py "$CANDIDATE" --node "$(command -v node)"
      - name: Build and test Linux release CLI
        run: |
          swift build --package-path Tools/SwiftMDCLI -c release -j 4 -Xswiftc -no-whole-module-optimization
          SWIFTMD_NODE="$(command -v node)" SWIFTMD_CLI="$GITHUB_WORKSPACE/Tools/SwiftMDCLI/.build/release/swift-md" python3 Scripts/test-cli.py
