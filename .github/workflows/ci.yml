name: SwiftMD
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:6.2.4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift test -j 4
  integration:
    runs-on: ubuntu-latest
    container: swift:6.2.4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --prefix Tools/NodeDependencies
      - name: Build independent cmark-gfm reference
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake build-essential python3 util-linux
          git clone --no-checkout https://github.com/github/cmark-gfm.git /tmp/cmark-reference
          git -C /tmp/cmark-reference checkout --detach 27d942c8b0a62d192f616e5bf3578f4b6a89e180
          cmake -S /tmp/cmark-reference -B /tmp/cmark-reference/build -DCMARK_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/cmark-reference/build -j 4
      - name: Test real renderers and reference
        env:
          SWIFTMD_CMARK_REFERENCE: /tmp/cmark-reference/build/src/cmark-gfm
        run: Scripts/test-all.sh
      - name: Build and test Linux release CLI
        run: |
          swift build --package-path Tools/SwiftMDCLI -c release -j 4 -Xswiftc -no-whole-module-optimization
          SWIFTMD_NODE="$(command -v node)" SWIFTMD_CLI="$GITHUB_WORKSPACE/Tools/SwiftMDCLI/.build/release/swift-md" python3 Scripts/test-cli.py
